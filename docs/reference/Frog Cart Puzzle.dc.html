      star1: win ? '#ffd52e' : '#cbb78f', star2: win ? '#ffd52e' : '#cbb78f', star3: win ? '#ffd52e' : '#cbb78f',
      heroB: hero.b, heroL: hero.l, heroD: hero.d,
      eyeTop: win ? 8 : 14, badgeShow: st.status === 'lose' ? 'flex' : 'none',
      mouthL: win ? 26 : 30, mouthT: win ? 52 : 58, mouthW: win ? 44 : 36, mouthH: win ? 22 : 12,
      mouthR: win ? '6px 6px 24px 24px' : '18px 18px 4px 4px',
      resumeShow: st.status === 'pause' ? 'flex' : 'none',
      resumeSize: 64,
      onPause: () => { if (this.state.status === 'play') this.setState({ status: 'pause', panel: false }); },
      onResume: () => { if (this.state.status === 'pause') this.setState({ status: 'play' }); },
      onRestart: () => {
        (this.timers || []).forEach(clearTimeout);
        this.resetRuntime();
        const root = this.root();
        if (root) root.querySelectorAll('[data-cart]').forEach(el => { el.style.display = ''; });
        if (root) root.querySelectorAll('[data-tongue]').forEach(g => g.setAttribute('opacity', '0'));
        this.setState(this.fresh());
      },
      onDown: e => {
        if (this.state.status !== 'play') return;
        this.dragging = true;
        this.holdTarget = e.currentTarget;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { }
        const h = this.hitTest(e, e.currentTarget);
        if (h) { this.eat(h.r, h.c); this.lastEat = performance.now(); }
      },
      onMove: e => {
        if (!this.dragging || this.state.status !== 'play') return;
        const now = performance.now();
        if (now - this.lastEat < (this.props.chainDelay ?? 90)) return;
        const h = this.hitTest(e, e.currentTarget);
        if (h && this.eat(h.r, h.c)) this.lastEat = now;
      },
      onUp: () => { this.dragging = false; }
    };
  }
}

</script>
</body>
